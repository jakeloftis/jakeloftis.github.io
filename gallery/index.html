<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0C;
    --ink: #F2F1ED;
    --muted: #7A7870;
    --accent: #F5D400;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
  }
  body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }
  header {
    padding: 4rem 0 2rem;
    border-bottom: 4px solid var(--accent);
    margin-bottom: 3rem;
  }
  a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    display: inline-block;
    margin-bottom: 1.5rem;
  }
  a.back:hover { color: var(--accent); }
  h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 3rem;
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0 0 0.75rem;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0;
  }
  .tagline::before {
    content: "// ";
    color: var(--accent);
  }
  #embeds {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }
  .embed-item {
    display: flex;
    flex-direction: column;
  }
  .embed-frame {
    border: 2px solid var(--ink);
    line-height: 0;
  }
  .embed-frame iframe {
    display: block;
    width: 100%;
    min-height: 300px;
    border: none;
  }
  .embed-caption {
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
    padding: 0.85rem 0.25rem;
    border-bottom: 2px solid var(--ink);
    font-size: 0.85rem;
  }
  .embed-caption .index {
    color: var(--muted);
    min-width: 1.75rem;
  }
  .embed-caption .cap-title {
    color: var(--ink);
  }
  .empty {
    color: var(--muted);
    padding: 1.5rem 0.25rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" href="/">&larr; home</a>
      <h1>gallery</h1>
      <p class="tagline">clips and images worth keeping</p>
    </header>
    <div id="embeds">
      <p class="empty">loading...</p>
    </div>
  </div>

  <script src="embeds.js"></script>
  <script>
    // Builds the right Imgur embed URL depending on link type, and pulls
    // a readable caption out of the slug (e.g. "tagilla-hip-fire" -> "tagilla hip fire").
    function parseImgurEmbed(url) {
      let match = url.match(/imgur\.com\/(a|gallery)\/(?:([\w-]+)-)?([a-zA-Z0-9]+)/i);
      if (match) {
        return {
          embedUrl: `https://imgur.com/a/${match[3]}/embed?pub=true`,
          caption: match[2] ? match[2].replace(/-/g, ' ') : null,
        };
      }
      match = url.match(/imgur\.com\/(?:([\w-]+)-)?([a-zA-Z0-9]{4,10})(?:[/?#]|$)/i);
      if (match) {
        return {
          embedUrl: `https://imgur.com/${match[2]}/embed`,
          caption: match[1] ? match[1].replace(/-/g, ' ') : null,
        };
      }
      return null;
    }

    function renderEmbeds() {
      const container = document.getElementById('embeds');
      const urls = (typeof imgurUrls !== 'undefined') ? imgurUrls : [];

      if (!urls.length) {
        container.innerHTML = '<p class="empty">nothing here yet.</p>';
        return;
      }

      container.innerHTML = '';

      urls.forEach((url, i) => {
        const parsed = parseImgurEmbed(url);
        if (!parsed) return;

        const item = document.createElement('div');
        item.className = 'embed-item';

        const frame = document.createElement('div');
        frame.className = 'embed-frame';

        const iframe = document.createElement('iframe');
        iframe.src = parsed.embedUrl;
        iframe.loading = 'lazy';
        iframe.allowFullscreen = true;
        iframe.scrolling = 'no';
        iframe.title = parsed.caption || url;

        frame.appendChild(iframe);
        item.appendChild(frame);

        const caption = document.createElement('div');
        caption.className = 'embed-caption';
        caption.innerHTML = `
          <span class="index">${String(i + 1).padStart(2, '0')}</span>
          <span class="cap-title">${parsed.caption || 'untitled'}</span>
        `;
        item.appendChild(caption);

        container.appendChild(item);
      });
    }

    // Imgur's embed iframe posts { message: 'resize_imgur', height: <px> }
    // from https://imgur.com once it knows its real content height.
    window.addEventListener('message', function (e) {
      if (e.origin !== 'https://imgur.com') return;

      let data = e.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (err) {
          return;
        }
      }

      if (!data || data.message !== 'resize_imgur' || typeof data.height !== 'number') return;

      document.querySelectorAll('.embed-frame iframe').forEach(iframe => {
        if (iframe.contentWindow === e.source) {
          iframe.style.height = data.height + 'px';
        }
      });
    });

    renderEmbeds();
  </script>
</body>
</html>
