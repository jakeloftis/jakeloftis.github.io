<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gallery</title>
<meta name="description" content="Clips and images worth keeping.">

<!-- Open Graph / Discord, Slack, iMessage, etc. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="jakiepoo">
<meta property="og:title" content="gallery">
<meta property="og:description" content="Clips and images worth keeping.">
<meta property="og:image" content="https://jakiepoo.com/assets/og/og-gallery.png">
<meta property="og:url" content="https://jakiepoo.com/gallery/">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="gallery">
<meta name="twitter:description" content="Clips and images worth keeping.">
<meta name="twitter:image" content="https://jakiepoo.com/assets/og/og-gallery.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16171A;
    --ink: #EDEDE6;
    --muted: #8C8B84;
    --accent: #8FAE93;
    --line: #2A2B2E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 5rem 1.5rem 4rem;
  }
  header {
    margin-bottom: 3rem;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.5rem;
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }
  .tagline {
    color: var(--muted);
    font-size: 1rem;
    margin: 0;
  }
  a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  a.back:hover { color: var(--accent); }
  #embeds {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }
  .embed-item {
    border-bottom: 1px solid var(--line);
    padding-bottom: 2.5rem;
  }
  .embed-item:last-child {
    border-bottom: none;
  }
  .empty {
    color: var(--muted);
    padding: 1.25rem 0;
  }
  .embed-media {
    display: block;
    width: 100%;
    border-radius: 4px;
    background: var(--line);
  }
  .embed-caption {
    margin: 0.75rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="back"><a class="back" href="/">&larr; home</a></p>
      <h1>gallery</h1>
      <p class="tagline">Clips and images worth keeping.</p>
    </header>
    <div id="embeds">
      <p class="empty">Loading…</p>
    </div>
  </div>

  <script src="embeds.js"></script>
  <script>
    function buildMediaElement(item) {
      if (item.type === 'video') {
        const video = document.createElement('video');
        video.className = 'embed-media';
        video.src = item.url;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.controls = false;
        return video;
      }
      const img = document.createElement('img');
      img.className = 'embed-media';
      img.src = item.url;
      img.loading = 'lazy';
      img.alt = item.caption || '';
      return img;
    }

    function renderEmbeds() {
      const container = document.getElementById('embeds');
      const items = (typeof galleryItems !== 'undefined') ? galleryItems : [];

      if (!items.length) {
        container.innerHTML = '<p class="empty">Nothing here yet.</p>';
        return;
      }

      container.innerHTML = '';

      items.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'embed-item';

        wrapper.appendChild(buildMediaElement(item));

        if (item.caption) {
          const caption = document.createElement('p');
          caption.className = 'embed-caption';
          caption.textContent = item.caption;
          wrapper.appendChild(caption);
        }

        container.appendChild(wrapper);
      });
    }

    renderEmbeds();
  </script>
</body>
</html>
