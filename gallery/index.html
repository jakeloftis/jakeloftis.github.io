<style>
  :root {
    --bg: #16171A;
    --ink: #EDEDE6;
    --muted: #8C8B84;
    --accent: #8FAE93;
    --line: #2A2B2E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 5rem 1.5rem 4rem;
  }
  header {
    margin-bottom: 3rem;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.5rem;
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }
  .tagline {
    color: var(--muted);
    font-size: 1rem;
    margin: 0;
  }
  a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  a.back:hover { color: var(--accent); }
  #embeds {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }
  .embed-item {
    border-bottom: 1px solid var(--line);
    padding-bottom: 2.5rem;
  }
  .embed-item:last-child {
    border-bottom: none;
  }
  .empty {
    color: var(--muted);
    padding: 1.25rem 0;
  }
  .embed-item iframe {
    display: block;
    width: 100%;
    min-height: 300px;
    border: none;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="back"><a class="back" href="/">&larr; home</a></p>
      <h1>gallery</h1>
      <p class="tagline">Clips and images worth keeping.</p>
    </header>
    <div id="embeds">
      <p class="empty">Loading…</p>
    </div>
  </div>

  <script src="embeds.js"></script>
  <script>
    // Builds the right Imgur embed URL depending on link type:
    // - Albums (imgur.com/a/...) use the /a/{id}/embed?pub=true endpoint
    // - Single image/gif/video posts use the plainer /{id}/embed endpoint
    function parseImgurEmbedUrl(url) {
      let match = url.match(/imgur\.com\/(a|gallery)\/(?:[\w-]+-)?([a-zA-Z0-9]+)/i);
      if (match) {
        return `https://imgur.com/a/${match[2]}/embed?pub=true`;
      }
      match = url.match(/imgur\.com\/(?:[\w-]+-)?([a-zA-Z0-9]{4,10})(?:[/?#]|$)/i);
      if (match) {
        return `https://imgur.com/${match[1]}/embed`;
      }
      return null;
    }

    function renderEmbeds() {
      const container = document.getElementById('embeds');
      const urls = (typeof imgurUrls !== 'undefined') ? imgurUrls : [];

      if (!urls.length) {
        container.innerHTML = '<p class="empty">Nothing here yet.</p>';
        return;
      }

      container.innerHTML = '';

      urls.forEach(url => {
        const embedUrl = parseImgurEmbedUrl(url);
        if (!embedUrl) return;

        const item = document.createElement('div');
        item.className = 'embed-item';

        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.loading = 'lazy';
        iframe.allowFullscreen = true;
        iframe.scrolling = 'no';
        iframe.title = url;

        item.appendChild(iframe);
        container.appendChild(item);
      });
    }

    // Imgur's embed iframe posts { message: 'resize_imgur', height: <px> }
    // from https://imgur.com once it knows its real content height.
    window.addEventListener('message', function (e) {
      if (e.origin !== 'https://imgur.com') return;

      let data = e.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (err) {
          return;
        }
      }

      if (!data || data.message !== 'resize_imgur' || typeof data.height !== 'number') return;

      document.querySelectorAll('.embed-item iframe').forEach(iframe => {
        if (iframe.contentWindow === e.source) {
          iframe.style.height = data.height + 'px';
        }
      });
    });

    renderEmbeds();
  </script>
</body>
</html>
