<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #16171A;
    --ink: #EDEDE6;
    --muted: #8C8B84;
    --accent: #8FAE93;
    --line: #2A2B2E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 5rem 1.5rem 4rem;
  }
  header {
    margin-bottom: 3rem;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.5rem;
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }
  .tagline {
    color: var(--muted);
    font-size: 1rem;
    margin: 0;
  }
  a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  a.back:hover { color: var(--accent); }
  #embeds {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }
  .embed-item {
    border-bottom: 1px solid var(--line);
    padding-bottom: 2.5rem;
  }
  .embed-item:last-child {
    border-bottom: none;
  }
  .empty {
    color: var(--muted);
    padding: 1.25rem 0;
  }
  .embed-media {
    display: block;
    width: 100%;
    border-radius: 4px;
    background: var(--line);
  }
  .embed-caption {
    margin: 0.75rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="back"><a class="back" href="/">&larr; home</a></p>
      <h1>gallery</h1>
      <p class="tagline">Clips and images worth keeping.</p>
    </header>
    <div id="embeds">
      <p class="empty">Loading…</p>
    </div>
  </div>

  <script src="embeds.js"></script>
  <script>
    // Imgur API Client ID - free, anonymous, read-only. Get one at
    // https://api.imgur.com/oauth2/addclient (choose "Anonymous usage
    // without user authorization"). Safe to expose client-side; that's
    // how this API is designed to be used for public read requests.
    const IMGUR_CLIENT_ID = 'YOUR_CLIENT_ID_HERE';

    // Extracts the type ('album' or 'image') and ID from an imgur URL.
    function parseImgurUrl(url) {
      let match = url.match(/imgur\.com\/(a|gallery)\/(?:[\w-]+-)?([a-zA-Z0-9]+)/i);
      if (match) {
        return { type: 'album', id: match[2] };
      }
      match = url.match(/imgur\.com\/(?:[\w-]+-)?([a-zA-Z0-9]{4,10})(?:[/?#]|$)/i);
      if (match) {
        return { type: 'image', id: match[1] };
      }
      return null;
    }

    // Fetches direct media info (link, mp4 if animated, title) from the
    // Imgur API instead of using their /embed iframe, so we render the
    // actual file ourselves with a plain <img>/<video> - no iframe chrome,
    // no white bars, full styling control.
    async function fetchImgurMedia(parsed) {
      const endpoint = parsed.type === 'album'
        ? `https://api.imgur.com/3/album/${parsed.id}`
        : `https://api.imgur.com/3/image/${parsed.id}`;

      const res = await fetch(endpoint, {
        headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` }
      });
      if (!res.ok) throw new Error(`Imgur API ${res.status}`);
      const json = await res.json();

      if (parsed.type === 'album') {
        const images = json.data.images || [];
        return { title: json.data.title || null, images };
      }
      return { title: json.data.title || null, images: [json.data] };
    }

    function buildMediaElement(image) {
      if (image.mp4) {
        const video = document.createElement('video');
        video.className = 'embed-media';
        video.src = image.mp4;
        video.poster = image.link;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.controls = false;
        return video;
      }
      const img = document.createElement('img');
      img.className = 'embed-media';
      img.src = image.link;
      img.loading = 'lazy';
      img.alt = image.title || image.description || '';
      return img;
    }

    async function renderEmbeds() {
      const container = document.getElementById('embeds');
      const urls = (typeof imgurUrls !== 'undefined') ? imgurUrls : [];

      if (!urls.length) {
        container.innerHTML = '<p class="empty">Nothing here yet.</p>';
        return;
      }

      container.innerHTML = '';

      for (const url of urls) {
        const parsed = parseImgurUrl(url);
        if (!parsed) continue;

        const item = document.createElement('div');
        item.className = 'embed-item';
        item.innerHTML = '<p class="empty">Loading…</p>';
        container.appendChild(item);

        try {
          const media = await fetchImgurMedia(parsed);
          item.innerHTML = '';
          media.images.forEach(image => {
            item.appendChild(buildMediaElement(image));
          });
          if (media.title) {
            const caption = document.createElement('p');
            caption.className = 'embed-caption';
            caption.textContent = media.title;
            item.appendChild(caption);
          }
        } catch (err) {
          item.innerHTML = `<p class="empty">Couldn't load this one — <a href="${url}" target="_blank" rel="noopener">view on Imgur</a>.</p>`;
        }
      }
    }

    renderEmbeds();
  </script>
</body>
</html>
