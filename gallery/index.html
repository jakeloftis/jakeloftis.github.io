<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gallery</title>
<meta name="description" content="Clips and images worth keeping.">

<!-- Open Graph / Discord, Slack, iMessage, etc. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="jakiepoo">
<meta property="og:title" content="gallery">
<meta property="og:description" content="Clips and images worth keeping.">
<meta property="og:image" content="https://jakiepoo.com/assets/og/og-gallery.png">
<meta property="og:url" content="https://jakiepoo.com/gallery/">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="gallery">
<meta name="twitter:description" content="Clips and images worth keeping.">
<meta name="twitter:image" content="https://jakiepoo.com/assets/og/og-gallery.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16171A;
    --ink: #EDEDE6;
    --muted: #8C8B84;
    --accent: #8FAE93;
    --line: #2A2B2E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 5rem 1.5rem 4rem;
  }
  header {
    margin-bottom: 3rem;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.5rem;
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }
  .tagline {
    color: var(--muted);
    font-size: 1rem;
    margin: 0;
  }
  a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  a.back:hover { color: var(--accent); }
  #embeds {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }
  .embed-item {
    border-bottom: 1px solid var(--line);
    padding-bottom: 2.5rem;
  }
  .embed-item:last-child {
    border-bottom: none;
  }
  .empty {
    color: var(--muted);
    padding: 1.25rem 0;
  }
  .embed-frame {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    border-radius: 4px;
    min-height: 50px;
  }
  .embed-frame iframe {
    display: block;
    position: absolute;
    top: -54px;
    left: 0;
    width: 100%;
    border: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="back"><a class="back" href="/">&larr; home</a></p>
      <h1>gallery</h1>
      <p class="tagline">Clips and images worth keeping.</p>
    </header>
    <div id="embeds">
      <p class="empty">Loading…</p>
    </div>
  </div>

  <script src="embeds.js"></script>
  <script>
    // Imgur's embed page has its own white "Share" bar (top) and imgur
    // logo bar (bottom) baked into the iframe content, which we can't
    // restyle since it's cross-origin. Instead we crop them out: the
    // iframe renders at full height but sits inside a shorter, clipped
    // container, shifted up so the top bar scrolls out of view above it.
    // Imgur's embed page has its own white "Share" bar (top) and a bottom
    // bar baked into the iframe content, which we can't restyle since it's
    // cross-origin. We crop them out by shifting the iframe up inside a
    // clipped container. Album embeds (?pub=true) have a short bottom bar
    // (just the imgur logo); single-image embeds have a taller one (a
    // caption line plus the logo), so they need extra bottom crop.
    // Imgur's embed page has its own white "Share"/caption bar (top) and
    // logo/caption bar (bottom) baked into the iframe content, which we
    // can't restyle since it's cross-origin - and since we can't read
    // pixels inside a cross-origin iframe either, we can't detect each
    // bar's real height automatically. Bar height turned out to depend on
    // whether that specific Imgur post has a title/caption set, not on
    // whether the link is an album or single image - so instead of
    // guessing per-type, we crop by one fixed amount large enough to
    // cover the tallest bar seen (a caption line + logo), applied to
    // every embed. This slightly over-crops entries with short/no
    // captions, trimming a little extra off the bottom of the image
    // rather than risking leftover white.
    const CROP_TOP = 70;
    const CROP_BOTTOM = 95;

    // Builds the right Imgur embed URL depending on link type:
    // - Albums (imgur.com/a/...) use the /a/{id}/embed?pub=true endpoint
    // - Single image/gif/video posts use the plainer /{id}/embed endpoint
    function parseImgurEmbedUrl(url) {
      let match = url.match(/imgur\.com\/(a|gallery)\/(?:[\w-]+-)?([a-zA-Z0-9]+)/i);
      if (match) {
        return `https://imgur.com/a/${match[2]}/embed?pub=true`;
      }
      match = url.match(/imgur\.com\/(?:[\w-]+-)?([a-zA-Z0-9]{4,10})(?:[/?#]|$)/i);
      if (match) {
        return `https://imgur.com/${match[1]}/embed`;
      }
      return null;
    }

    function renderEmbeds() {
      const container = document.getElementById('embeds');
      const urls = (typeof imgurUrls !== 'undefined') ? imgurUrls : [];

      if (!urls.length) {
        container.innerHTML = '<p class="empty">Nothing here yet.</p>';
        return;
      }

      container.innerHTML = '';

      urls.forEach(url => {
        const embedUrl = parseImgurEmbedUrl(url);
        if (!embedUrl) return;

        const item = document.createElement('div');
        item.className = 'embed-item';

        const frame = document.createElement('div');
        frame.className = 'embed-frame';

        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.loading = 'lazy';
        iframe.allowFullscreen = true;
        iframe.scrolling = 'no';
        iframe.title = url;

        frame.appendChild(iframe);
        item.appendChild(frame);
        container.appendChild(item);
      });
    }

    // Imgur's embed iframe posts { message: 'resize_imgur', height: <px> }
    // from https://imgur.com once it knows its real content height.
    window.addEventListener('message', function (e) {
      if (e.origin !== 'https://imgur.com') return;

      let data = e.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (err) {
          return;
        }
      }

      if (!data || data.message !== 'resize_imgur' || typeof data.height !== 'number') return;

      document.querySelectorAll('.embed-frame iframe').forEach(iframe => {
        if (iframe.contentWindow === e.source) {
          iframe.style.height = data.height + 'px';
          const frame = iframe.parentElement;
          const visibleHeight = Math.max(data.height - CROP_TOP - CROP_BOTTOM, 50);
          frame.style.height = visibleHeight + 'px';
        }
      });
    });

    renderEmbeds();
  </script>
</body>
</html>
