<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jakiepoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0C;
    --ink: #F2F1ED;
    --muted: #7A7870;
    --accent: #F5D400;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
  }
  body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }
  header {
    padding: 4rem 0 2rem;
    border-bottom: 4px solid var(--accent);
    margin-bottom: 0;
  }
  h1 {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 3rem;
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0 0 0.75rem;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0;
  }
  .tagline::before {
    content: "// ";
    color: var(--accent);
  }
  .pages {
    display: flex;
    flex-direction: column;
  }
  .page-entry {
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
    padding: 1.5rem 0.25rem;
    border-bottom: 2px solid var(--ink);
    text-decoration: none;
    color: var(--ink);
  }
  .page-entry:hover,
  .page-entry:focus-visible {
    background: var(--ink);
    color: var(--bg);
  }
  .page-entry:focus-visible {
    outline: none;
  }
  .page-entry .index {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    min-width: 1.75rem;
  }
  .page-entry:hover .index {
    color: var(--bg);
  }
  .page-entry .title {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: -0.01em;
  }
  .empty {
    color: var(--muted);
    padding: 1.5rem 0.25rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>jakiepoo</h1>
      <p class="tagline">notes, projects, and pages worth keeping</p>
    </header>
    <div class="pages" id="pages">
      <p class="empty">loading...</p>
    </div>
  </div>

  <script>
    async function loadPages() {
      const container = document.getElementById('pages');
      try {
        const res = await fetch('/manifest.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('manifest.json not found');
        const pages = await res.json();

        if (!Array.isArray(pages) || pages.length === 0) {
          container.innerHTML = '<p class="empty">nothing published yet.</p>';
          return;
        }

        container.innerHTML = pages.map((page, i) => `
          <a class="page-entry" href="/${page.slug}/">
            <span class="index">${String(i + 1).padStart(2, '0')}</span>
            <span class="title">${page.title}</span>
          </a>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p class="empty">nothing published yet.</p>';
      }
    }

    loadPages();
  </script>
</body>
</html>
